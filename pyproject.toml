[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-messagebus-chat-plugin"
dynamic = ["version"]
description = "OVOS ChatEngine agent plugin that proxies turns through a connected OVOS messagebus"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [
    { name = "jarbasAi", email = "jarbasai@mailfence.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ovos-bus-client>=1.3.1,<3.0.0",
    "ovos-plugin-manager>=2.4.0a1,<3.0.0",
    "ovos-utils>=0.8.2,<1.0.0",
    "pyee>=13.0.1,<13.1.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-messagebus-chat-plugin"
Issues = "https://github.com/OpenVoiceOS/ovos-messagebus-chat-plugin/issues"

[project.entry-points."opm.agents.chat"]
"ovos-messagebus" = "ovos_messagebus_chat_plugin:OVOSMessagebusChatAgent"

[tool.setuptools.dynamic]
version = { attr = "ovos_messagebus_chat_plugin.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_messagebus_chat_plugin*"]
